name: Sagano 19/11 monitor

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub's minimum; runs can be delayed a few minutes)
  workflow_dispatch:         # lets you run it manually from the Actions tab

concurrency:
  group: sagano-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container: mcr.microsoft.com/playwright:v1.48.2-jammy
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright@1.48.2
      - run: node check.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HOME: /root
